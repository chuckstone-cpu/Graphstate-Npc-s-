<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Tier AI - Pathfinder Visualization</title>
    <!-- Load Phaser 3 via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            color: white;
            font-family: sans-serif;
            flex-direction: column;
        }
        #game-container {
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>Two-Tier AI: D* Lite Execution</h2>
    <div id="game-container"></div>

    <script>
        const config = {
            type: Phaser.AUTO,
            width: 640,  // 20 tiles * 32px = 640
            height: 640, // 20 tiles * 32px = 640
            parent: 'game-container',
            scene: {
                preload: preload,
                create: create
            }
        };

        const game = new Phaser.Game(config);

        function preload() {
            // Load the map data with a cache-buster so the browser picks up our newly patched map.json
            this.load.tilemapTiledJSON('map', 'map.json?v=' + Date.now());
            
            // Load the tileset image with a cache-buster
            this.load.image('dungeon_tiles', 'dungeon.png?v=' + Date.now());
        }

        async function create() {
            // 1. Render the Tilemap
            const map = this.make.tilemap({ key: 'map' });
            
            // 'Dungeon' must match the name of the tileset defined inside Tiled/Dungeon.tsx
            const tileset = map.addTilesetImage('Dungeon', 'dungeon_tiles');
            
            // Render all the layers
            const envLayer = map.createLayer('environment', tileset, 0, 0);
            const wallsLayer = map.createLayer('walls and obstacles', tileset, 0, 0);
            const decorLayer = map.createLayer('decor', tileset, 0, 0);
            const defDecorLayer = map.createLayer('definitive decor', tileset, 0, 0);

            // 2. Create the NPC Sprite (A simple red rectangle)
            // coordinate [1, 18] -> x: 1 * 32 = 32, y: 18 * 32 = 576
            const npc = this.add.rectangle(32, 576, 32, 32, 0xff0000);
            npc.setOrigin(0, 0); // Set origin to top-left to align perfectly with the grid

            // 3. Fetch the path from our FastAPI server
            try {
                // Call the FastAPI endpoint
                const response = await fetch('http://127.0.0.1:8000/solve_dungeon');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                // 4. Combine paths
                // Combine path_to_key and path_to_chest. 
                // We use slice(1) on the second path to prevent pausing on the overlapping Pot coordinate [16, 11]
                const masterPath = data.path_to_key.concat(data.path_to_chest.slice(1));
                
                // 5. Build Timeline/Tweens to move the NPC
                moveNpcAlongPath(this, npc, masterPath);
                
            } catch (error) {
                console.error("Failed to fetch path from server. Make sure FastAPI is running!", error);
            }
        }

        function moveNpcAlongPath(scene, npc, path) {
            if (!path || path.length === 0) return;

            // We create an array of tweens, one for each step in the path
            const tweenChain = [];
            
            // Skip the first index (i=0) because it's the spawn point where the NPC already is
            for (let i = 1; i < path.length; i++) {
                const [tileX, tileY] = path[i];
                
                tweenChain.push({
                    targets: npc,
                    x: tileX * 32,
                    y: tileY * 32,
                    duration: 150, // Move speed (150ms per tile)
                    ease: 'Linear'
                });
            }

            // Execute the chain of tweens sequentially
            scene.tweens.chain({
                tweens: tweenChain
            });
        }
    </script>
</body>
</html>
